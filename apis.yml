aid: sayduck
name: SayDuck
description: >-
  Sayduck is a 3D product visualization platform for ecommerce that turns static
  product pages into interactive shopping experiences. Brands upload 3D assets to
  a self-service platform and embed them as interactive 3D configurators, WebAR
  (view-in-your-space) experiences, and virtual product photography. The public
  integration surface is a browser-native Web Component (`<sayduck-viewer>`) with
  an in-page JavaScript API driven by DOM CustomEvents; the platform is backed by
  a GraphQL API internally. Founded in 2012 by Niklas Slotte, part of Goodbye
  Kansas Group 2019-2023, and independent since 2024 via The Optical Foundry.
